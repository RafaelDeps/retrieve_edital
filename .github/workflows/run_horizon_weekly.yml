name: Weekly Horizon Europe Scraper

# Cadência semanal, e não diária: o dataset de origem tem ~126 MB e muda pouco de
# um dia para o outro. Por isso o HORIZON é fonte opcional do runner: a execução
# diária não o inclui, e este workflow o roda com `--only HORIZON`.
on:
  schedule:
    # Segundas às 04:00 UTC (01:00 em Brasília), depois do scraper diário.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# Diário e semanal commitam nos mesmos arquivos: no mesmo branch, um espera o
# outro terminar (sem cancelar), para o segundo push não ser recusado.
concurrency:
  group: data-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-horizon:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        # Ponta do branch no início do job, não o commit do momento do disparo:
        # na fila de concorrência, o outro workflow pode ter commitado enquanto
        # este esperava, e partir do commit antigo gera conflito no rebase.
        ref: ${{ github.ref_name }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Horizon Europe Flow (runner)
      env:
        LLM_PROVIDER: gemini
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        # Divisões do Horizon Europe a indexar. `HORIZON` cobre o programa
        # inteiro, porque a comparação é por prefixo — foi a decisão de
        # 2026-07-31. Para restringir, defina a variável de repositório
        # HORIZON_DIVISIONS com os códigos separados por vírgula.
        HORIZON_DIVISIONS: ${{ vars.HORIZON_DIVISIONS || 'HORIZON' }}
      # Pelo runner: ganha linha no flow_processing_log.md, teto de duração e o
      # realinhamento de status ao prazo (antes era um passo separado).
      run: |
        python scripts/run_all_flows.py --only HORIZON

    - name: Commit and Push JSON Results
      # Roda mesmo se a coleta falhou (falha parcial): o que as outras fontes
      # coletaram não pode se perder. Só não roda se a execução foi cancelada.
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # Diretórios, não arquivos: um caminho ausente faria o git add falhar inteiro.
        # registry/ leva o índice de processados e o de recusados.
        git add -- data/output registry docs/flow_processing_log.md
        if git diff --staged --quiet; then
          echo "Nada a commitar."
          exit 0
        fi
        git commit -m "chore: atualiza chamadas do Horizon Europe [skip ci]"
        git pull --rebase origin "$GITHUB_REF_NAME"
        git push origin "HEAD:$GITHUB_REF_NAME"
