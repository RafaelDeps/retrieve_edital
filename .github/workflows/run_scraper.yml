name: Daily Edital Scraper

on:
  schedule:
    # Roda todos os dias às 03:00 UTC (meia-noite no horário de Brasília, UTC-3)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite disparo manual pela UI do GitHub
    inputs:
      only:
        description: "Fontes separadas por vírgula (vazio = todas as diárias)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

# Diário e semanal commitam nos mesmos arquivos: no mesmo branch, um espera o
# outro terminar (sem cancelar), para o segundo push não ser recusado.
concurrency:
  group: data-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-editais:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        # Ponta do branch no início do job, não o commit do momento do disparo:
        # na fila de concorrência, o outro workflow pode ter commitado enquanto
        # este esperava, e partir do commit antigo gera conflito no rebase.
        ref: ${{ github.ref_name }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers
      run: playwright install chromium --with-deps

    - name: Run Scraper (Extract, Transform, Sink)
      env:
        LLM_PROVIDER: gemini
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        # O input vai por variável de ambiente, nunca interpolado direto no shell.
        ONLY: ${{ inputs.only }}
      run: |
        if [ -n "$ONLY" ]; then
          python scripts/run_all_flows.py --only "$ONLY"
        else
          python scripts/run_all_flows.py
        fi

    - name: Commit and Push JSON Results
      # Roda mesmo se a coleta falhou (falha parcial): o que as outras fontes
      # coletaram não pode se perder. Só não roda se a execução foi cancelada.
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # Diretórios, não arquivos: um caminho ausente faria o git add falhar inteiro.
        # registry/ leva o índice de processados e o de recusados.
        git add -- data/output registry docs/flow_processing_log.md
        if git diff --staged --quiet; then
          echo "Nada a commitar."
          exit 0
        fi
        git commit -m "chore: atualiza dados raspados dos editais [skip ci]"
        git pull --rebase origin "$GITHUB_REF_NAME"
        git push origin "HEAD:$GITHUB_REF_NAME"
